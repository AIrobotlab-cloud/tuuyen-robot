<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Tử Uyên — Pure Cyber Face V3.6</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background-color: #020617; color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .top-bar {
            width: 100%; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; letter-spacing: 1px; color: #64748b; border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 20;
        }
        .status-badge { display: flex; align-items: center; gap: 6px; color: #38bdf8; font-weight: 600; }
        .dot { width: 7px; height: 7px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px #38bdf8; animation: pulse 2s infinite; }

        .control-group { display: flex; gap: 8px; align-items: center; }
        .select-btn, .mode-toggle {
            padding: 6px 12px; background: rgba(15, 23, 42, 0.85); border: 1px solid #0284c7;
            border-radius: 18px; color: #38bdf8; font-size: 11px; font-weight: 600; outline: none; cursor: pointer;
        }
        .mode-toggle.pro { border-color: #f59e0b; color: #fbbf24; background: rgba(245, 158, 11, 0.18); }

        /* KHU VỰC KHUÔN MẶT ROBOT TOÀN MÀN HÌNH (KHÔNG CHỮ) */
        .face-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; }
        .eyebrows-wrapper { display: flex; gap: 90px; margin-bottom: 16px; }
        .eyebrow { width: 95px; height: 9px; background: #38bdf8; border-radius: 5px; box-shadow: 0 0 18px rgba(56, 189, 248, 0.65); transition: all 0.3s; }

        .eyes-wrapper { display: flex; gap: 65px; align-items: center; justify-content: center; position: relative; }
        .eye {
            width: 140px; height: 140px;
            background: radial-gradient(circle at 40% 40%, #38bdf8 0%, #0284c7 55%, #0369a1 100%);
            border-radius: 44px; box-shadow: 0 0 55px rgba(56, 189, 248, 0.45), inset 0 0 25px rgba(255, 255, 255, 0.5);
            position: relative; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
        }
        .pupil {
            position: absolute; width: 48px; height: 48px; background: rgba(255, 255, 255, 0.95);
            border-radius: 50%; top: 26px; left: 26px; filter: blur(1px); transition: all 0.4s ease-out;
        }

        .eye.blink { height: 6px !important; margin-top: 67px; border-radius: 10px; }
        .eye.blink .pupil { opacity: 0; }

        .state-listening .eyebrow { background: #22c55e; box-shadow: 0 0 20px #22c55e; transform: translateY(-8px); }
        .state-listening .eye { background: radial-gradient(circle at 40% 40%, #4ade80 0%, #22c55e 60%, #15803d 100%); box-shadow: 0 0 60px rgba(34, 197, 94, 0.6); transform: scale(1.05); }

        .state-thinking .eyebrow.left { transform: rotate(12deg) translateY(4px); background: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .state-thinking .eyebrow.right { transform: rotate(-12deg) translateY(4px); background: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .state-thinking .eye { background: radial-gradient(circle at 40% 40%, #fbbf24 0%, #f59e0b 60%, #b45309 100%); box-shadow: 0 0 60px rgba(245, 158, 11, 0.6); }
        .state-thinking .pupil { transform: translate(15px, -10px); }

        .state-speaking .eye { animation: speakingPulse 0.35s infinite alternate ease-in-out; }
        @keyframes speakingPulse { 0% { height: 125px; } 100% { height: 150px; } }

        .visualizer { display: flex; gap: 7px; height: 35px; align-items: center; margin-top: 40px; }
        .bar { width: 6px; height: 6px; background: #38bdf8; border-radius: 4px; }
        .state-speaking .bar { animation: audioWave 0.4s infinite alternate ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.1s; } .bar:nth-child(2) { animation-delay: 0.25s; }
        .bar:nth-child(3) { animation-delay: 0.05s; } .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.15s; }
        @keyframes audioWave { 0% { height: 6px; } 100% { height: 32px; background: #7dd3fc; } }

        .controls { width: 100%; padding: 24px; display: flex; flex-direction: column; align-items: center; z-index: 20; }
        .mic-btn {
            width: 76px; height: 76px; border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: white;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 30px rgba(2, 132, 199, 0.45); transition: all 0.2s;
        }
        .mic-btn:active { transform: scale(0.92); }
        .mic-btn.active { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 35px rgba(239, 68, 68, 0.7); animation: pulse-red 1.5s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; } }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body class="state-idle">
    <div class="top-bar">
        <div class="status-badge"><div class="dot"></div><span id="status-text">TRỰC GÁC</span></div>
        <div class="control-group">
            <select class="select-btn" id="voice-select">
                <option value="vip_taothao">👑 VIP Tào Tháo (Bá Nghị)</option>
                <option value="nam_minh">🎙️ Nam Minh (Trầm Binh Gia)</option>
                <option value="hoai_my">🌸 Hoài My (Nữ Thanh Thoát)</option>
            </select>
            <button class="mode-toggle" id="mode-btn" onclick="toggleModelMode()">⚡ Huấn luyện (~2đ)</button>
        </div>
    </div>

    <div class="face-container" onclick="keepScreenAwakeAndUnlock()">
        <div class="eyebrows-wrapper">
            <div class="eyebrow left" id="eyebrow-left"></div>
            <div class="eyebrow right" id="eyebrow-right"></div>
        </div>
        <div class="eyes-wrapper">
            <div class="eye left" id="eye-left"><div class="pupil" id="pupil-left"></div></div>
            <div class="eye right" id="eye-right"><div class="pupil" id="pupil-right"></div></div>
        </div>
        <div class="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>

    <div class="controls">
        <button class="mic-btn" id="mic-btn" onclick="toggleVoiceSession()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </button>
    </div>

    <audio id="server-audio" style="display: none;" playsinline preload="auto"></audio>

    <script>
        const body = document.body;
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        const pupilLeft = document.getElementById('pupil-left');
        const pupilRight = document.getElementById('pupil-right');
        const statusText = document.getElementById('status-text');
        const micBtn = document.getElementById('mic-btn');
        const modeBtn = document.getElementById('mode-btn');
        const voiceSelect = document.getElementById('voice-select');
        const serverAudio = document.getElementById('server-audio');

        let currentModel = 'gpt-4o-mini';
        let isListening = false;
        let recognition = null;
        let wakeLock = null;
        let isAudioUnlocked = false;
        let silenceStandbyTimer = null;
        let speechPauseTimer = null;
        let accumulatedTranscript = "";

        // 1. GIỮ MÀN HÌNH ĐIỆN THOẠI LUÔN SÁNG (WAKE LOCK + AUTO RE-ACQUIRE MỖI 10 GIÂY)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => { wakeLock = null; });
                }
            } catch (err) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });
        document.addEventListener('touchstart', () => { requestWakeLock(); }, { passive: true });
        setInterval(() => {
            if (document.visibilityState === 'visible') requestWakeLock();
        }, 10000);

        // 2. MỞ KHÓA KÊNH LOA DI ĐỘNG NGAY CÚ CHẠM ĐẦU TIÊN (CHỐNG LỖI CÂM TIẾNG)
        function unlockAudio() {
            if (!isAudioUnlocked) {
                serverAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
                serverAudio.play().then(() => {
                    isAudioUnlocked = true;
                }).catch(() => {});
            }
        }

        function keepScreenAwakeAndUnlock() {
            requestWakeLock();
            unlockAudio();
        }

        function toggleModelMode() {
            keepScreenAwakeAndUnlock();
            if (currentModel === 'gpt-4o-mini') {
                currentModel = 'gpt-4o';
                modeBtn.classList.add('pro');
                modeBtn.innerText = "👑 Demo (GPT-4o)";
            } else {
                currentModel = 'gpt-4o-mini';
                modeBtn.classList.remove('pro');
                modeBtn.innerText = "⚡ Huấn luyện (~2đ)";
            }
        }

        // 3. HIỆU ỨNG CHỚP MẮT & ĐẢO ĐỒNG TỬ TỰ NHIÊN
        function triggerBlink() {
            if (!body.classList.contains('state-speaking')) {
                eyeLeft.classList.add('blink'); eyeRight.classList.add('blink');
                setTimeout(() => { eyeLeft.classList.remove('blink'); eyeRight.classList.remove('blink'); }, 140);
            }
            setTimeout(triggerBlink, Math.random() * 3500 + 2500);
        }
        triggerBlink();

        function triggerLookAround() {
            if (body.classList.contains('state-idle')) {
                const offsetX = (Math.random() - 0.5) * 30;
                const offsetY = (Math.random() - 0.5) * 20;
                pupilLeft.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
                pupilRight.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }
            setTimeout(triggerLookAround, Math.random() * 4000 + 3000);
        }
        triggerLookAround();

        function setRobotState(state) {
            body.className = '';
            body.classList.add(`state-${state}`);
            if (state === 'idle') {
                pupilLeft.style.transform = 'translate(0, 0)';
                pupilRight.style.transform = 'translate(0, 0)';
                statusText.innerText = "TRỰC GÁC";
            } else if (state === 'listening') {
                statusText.innerText = "LẮNG NGHE";
            } else if (state === 'thinking') {
                statusText.innerText = "SUY NGẪM";
            } else if (state === 'speaking') {
                statusText.innerText = "CẤT TIẾNG";
            }
        }

        // 4. BỘ ĐẾM NGHỈ CHỜ THÔNG MINH (15 GIÂY KHÔNG NÓI THÌ VỀ TRỰC GÁC, KHÔNG BAO GIỜ TỰ NGHĨ)
        function resetSilenceStandby() {
            clearTimeout(silenceStandbyTimer);
            if (isListening) {
                silenceStandbyTimer = setTimeout(() => {
                    if (isListening && !body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                        stopListeningSession();
                    }
                }, 15000);
            }
        }

        function stopListeningSession() {
            isListening = false;
            clearTimeout(silenceStandbyTimer);
            clearTimeout(speechPauseTimer);
            accumulatedTranscript = "";
            micBtn.classList.remove('active');
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            setRobotState('idle');
        }

        function startListeningSession() {
            if (!recognition) return;
            accumulatedTranscript = "";
            try {
                recognition.start();
                isListening = true;
                micBtn.classList.add('active');
                setRobotState('listening');
                resetSilenceStandby();
            } catch (e) {}
        }

        // 5. NHẬN DIỆN GIỌNG NÓI CHO PHÉP CÂU DÀI (ĐỢI NGỪNG NÓI 1.6 GIÂY MỚI CHỐT CÂU)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'vi-VN';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                if (!body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                    setRobotState('listening');
                    resetSilenceStandby();
                }
            };

            recognition.onresult = (event) => {
                clearTimeout(silenceStandbyTimer);
                clearTimeout(speechPauseTimer);

                let currentSessionText = "";
                for (let i = 0; i < event.results.length; i++) {
                    currentSessionText += event.results[i][0].transcript + " ";
                }
                accumulatedTranscript = currentSessionText.trim();

                // Đợi đạo hữu ngừng nói 1.6 giây (để lấy hơi nói câu dài thoải mái) rồi mới gửi đi
                if (accumulatedTranscript.length >= 2) {
                    speechPauseTimer = setTimeout(() => {
                        const finalQuery = accumulatedTranscript.trim();
                        accumulatedTranscript = "";
                        try { recognition.stop(); } catch (e) {}
                        if (finalQuery.length >= 2) {
                            handleUserSpeech(finalQuery);
                        }
                    }, 1600);
                } else {
                    resetSilenceStandby();
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech') {
                    if (isListening) resetSilenceStandby();
                    setRobotState('idle');
                } else if (e.error !== 'aborted') {
                    stopListeningSession();
                }
            };

            recognition.onend = () => {
                if (accumulatedTranscript && accumulatedTranscript.trim().length >= 2 && !body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                    clearTimeout(speechPauseTimer);
                    const finalQuery = accumulatedTranscript.trim();
                    accumulatedTranscript = "";
                    handleUserSpeech(finalQuery);
                    return;
                }

                if (isListening && !body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                    setTimeout(() => {
                        if (isListening && !body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                            try { recognition.start(); } catch (err) {}
                        }
                    }, 350);
                }
            };
        }

        function toggleVoiceSession() {
            keepScreenAwakeAndUnlock();

            if (!recognition) {
                alert("Trình duyệt không hỗ trợ nhận diện giọng nói. Vui lòng dùng Chrome hoặc Safari.");
                return;
            }

            if (!isListening) {
                startListeningSession();
            } else {
                stopListeningSession();
            }
        }

        // 6. GỬI CÂU HỎI & PHÁT ÂM THANH TRẢ LỜI (CÓ CHỐT CHẶN CHỐNG TỰ NGHĨ KHI IM LẶNG)
        async function handleUserSpeech(query) {
            clearTimeout(silenceStandbyTimer);
            clearTimeout(speechPauseTimer);

            if (!query || typeof query !== 'string' || query.trim().length < 2) {
                setRobotState('idle');
                if (isListening) resetSilenceStandby();
                return;
            }

            const cleanText = query.trim();
            setRobotState('thinking');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: cleanText, 
                        model: currentModel,
                        voice: voiceSelect.value 
                    })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const audioBase64 = data.audio || data.audio_base64 || "";

                if (audioBase64 && typeof audioBase64 === 'string' && audioBase64.length > 200) {
                    setRobotState('speaking');
                    serverAudio.src = "data:audio/mp3;base64," + audioBase64;

                    serverAudio.onended = () => {
                        setRobotState('idle');
                        if (isListening) {
                            setTimeout(() => {
                                if (isListening) {
                                    accumulatedTranscript = "";
                                    try { 
                                        recognition.start(); 
                                        setRobotState('listening');
                                        resetSilenceStandby();
                                    } catch (e) {}
                                }
                            }, 600);
                        }
                    };

                    serverAudio.onerror = () => {
                        setRobotState('idle');
                        if (isListening) resetSilenceStandby();
                    };

                    const playPromise = serverAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {
                            setTimeout(() => { serverAudio.play().catch(() => {}); }, 150);
                            setRobotState('speaking');
                        });
                    }
                } else {
                    setRobotState('idle');
                    if (isListening) resetSilenceStandby();
                }

            } catch (err) {
                setRobotState('idle');
                if (isListening) resetSilenceStandby();
            }
        }
    </script>
</body>
</html>
