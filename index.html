<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Tử Uyên — Cyber Face Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #030712; color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .top-bar {
            width: 100%; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; letter-spacing: 1px; color: #64748b; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .status-badge { display: flex; align-items: center; gap: 8px; color: #38bdf8; font-weight: 600; }
        .dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 12px #38bdf8; animation: pulse 2s infinite; }

        /* NÚT CHUYỂN ĐỔI CHẾ ĐỘ TIẾT KIỆM / CAO CẤP */
        .mode-toggle {
            padding: 6px 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid #0284c7;
            border-radius: 20px; color: #38bdf8; font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .mode-toggle.pro {
            background: rgba(245, 158, 11, 0.15); border-color: #f59e0b; color: #fbbf24;
        }

        .face-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative; }
        .eyebrows-wrapper { display: flex; gap: 90px; margin-bottom: 15px; }
        .eyebrow { width: 90px; height: 8px; background: #38bdf8; border-radius: 4px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.6); transition: all 0.3s; }

        .eyes-wrapper { display: flex; gap: 60px; align-items: center; justify-content: center; position: relative; }
        .eye {
            width: 135px; height: 135px;
            background: radial-gradient(circle at 40% 40%, #38bdf8 0%, #0284c7 55%, #0369a1 100%);
            border-radius: 42px; box-shadow: 0 0 50px rgba(56, 189, 248, 0.4), inset 0 0 25px rgba(255, 255, 255, 0.5);
            position: relative; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
        }
        .pupil {
            position: absolute; width: 45px; height: 45px; background: rgba(255, 255, 255, 0.95);
            border-radius: 50%; top: 25px; left: 25px; filter: blur(1px); transition: all 0.4s ease-out;
        }

        .eye.blink { height: 6px !important; margin-top: 64px; border-radius: 10px; }
        .eye.blink .pupil { opacity: 0; }

        .state-listening .eyebrow { background: #22c55e; box-shadow: 0 0 20px #22c55e; transform: translateY(-8px); }
        .state-listening .eye { background: radial-gradient(circle at 40% 40%, #4ade80 0%, #22c55e 60%, #15803d 100%); box-shadow: 0 0 60px rgba(34, 197, 94, 0.6); transform: scale(1.06); }

        .state-thinking .eyebrow.left { transform: rotate(12deg) translateY(4px); background: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .state-thinking .eyebrow.right { transform: rotate(-12deg) translateY(4px); background: #f59e0b; box-shadow: 0 0 20px #f59e0b; }
        .state-thinking .eye { background: radial-gradient(circle at 40% 40%, #fbbf24 0%, #f59e0b 60%, #b45309 100%); box-shadow: 0 0 60px rgba(245, 158, 11, 0.6); }
        .state-thinking .pupil { transform: translate(15px, -10px); }

        .state-speaking .eye { animation: speakingPulse 0.35s infinite alternate ease-in-out; }
        @keyframes speakingPulse { 0% { height: 120px; } 100% { height: 145px; } }

        .visualizer { display: flex; gap: 7px; height: 35px; align-items: center; margin-top: 35px; }
        .bar { width: 6px; height: 6px; background: #38bdf8; border-radius: 4px; }
        .state-speaking .bar { animation: audioWave 0.4s infinite alternate ease-in-out; }
        .bar:nth-child(1) { animation-delay: 0.1s; } .bar:nth-child(2) { animation-delay: 0.25s; }
        .bar:nth-child(3) { animation-delay: 0.05s; } .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.15s; }
        @keyframes audioWave { 0% { height: 6px; } 100% { height: 32px; background: #7dd3fc; } }

        .dialogue-box {
            width: 90%; max-width: 620px; min-height: 70px; padding: 16px 22px;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px;
            text-align: center; font-size: 16px; line-height: 1.6; color: #e2e8f0; margin-bottom: 20px;
        }
        .controls { width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .mic-btn {
            width: 76px; height: 76px; border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: white;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 30px rgba(2, 132, 199, 0.45); transition: all 0.2s;
        }
        .mic-btn:active { transform: scale(0.92); }
        .mic-btn.active { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 35px rgba(239, 68, 68, 0.7); animation: pulse-red 1.5s infinite; }
        .hint-text { font-size: 13px; color: #94a3b8; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; } }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body class="state-idle">
    <div class="top-bar">
        <div class="status-badge"><div class="dot"></div><span id="status-text">TRỰC GÁC</span></div>
        <!-- NÚT BẤM CHUYỂN ĐỔI MODEL -->
        <button class="mode-toggle" id="mode-btn" onclick="toggleModelMode()">⚡ Huấn luyện (~2đ)</button>
    </div>

    <div class="face-container">
        <div class="eyebrows-wrapper">
            <div class="eyebrow left" id="eyebrow-left"></div>
            <div class="eyebrow right" id="eyebrow-right"></div>
        </div>
        <div class="eyes-wrapper">
            <div class="eye left" id="eye-left"><div class="pupil" id="pupil-left"></div></div>
            <div class="eye right" id="eye-right"><div class="pupil" id="pupil-right"></div></div>
        </div>
        <div class="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>

    <div class="dialogue-box" id="dialogue-text">Chạm vào Micro để bắt đầu đàm đạo cùng Tử Uyên...</div>

    <div class="controls">
        <button class="mic-btn" id="mic-btn" onclick="toggleVoiceSession()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </button>
        <span class="hint-text" id="hint-text">Chạm để mở đàm thoại rảnh tay hai chiều</span>
    </div>

    <script>
        const body = document.body;
        const eyeLeft = document.getElementById('eye-left');
        const eyeRight = document.getElementById('eye-right');
        const pupilLeft = document.getElementById('pupil-left');
        const pupilRight = document.getElementById('pupil-right');
        const statusText = document.getElementById('status-text');
        const dialogueText = document.getElementById('dialogue-text');
        const micBtn = document.getElementById('mic-btn');
        const hintText = document.getElementById('hint-text');
        const modeBtn = document.getElementById('mode-btn');

        let currentModel = 'qwen-flash'; // Mặc định siêu rẻ
        let isListening = false;
        let recognition = null;
        let speechSynth = window.speechSynthesis;

        // BẬT / TẮT CHẾ ĐỘ MODEL
        function toggleModelMode() {
            if (currentModel === 'qwen-flash') {
                currentModel = 'gpt-4o';
                modeBtn.classList.add('pro');
                modeBtn.innerText = "👑 Demo (GPT-4o)";
                dialogueText.innerText = "Đã chuyển sang chế độ DEMO (Mô hình GPT-4o cao cấp).";
            } else {
                currentModel = 'qwen-flash';
                modeBtn.classList.remove('pro');
                modeBtn.innerText = "⚡ Huấn luyện (~2đ)";
                dialogueText.innerText = "Đã chuyển sang chế độ HUẤN LUYỆN (Mô hình Qwen-Flash siêu tiết kiệm).";
            }
        }

        function triggerBlink() {
            if (!body.classList.contains('state-speaking')) {
                eyeLeft.classList.add('blink'); eyeRight.classList.add('blink');
                setTimeout(() => { eyeLeft.classList.remove('blink'); eyeRight.classList.remove('blink'); }, 140);
            }
            setTimeout(triggerBlink, Math.random() * 3500 + 2500);
        }
        triggerBlink();

        function triggerLookAround() {
            if (body.classList.contains('state-idle')) {
                const offsetX = (Math.random() - 0.5) * 30;
                const offsetY = (Math.random() - 0.5) * 20;
                pupilLeft.style.transform = `translate(${offsetX}px,${offsetY}px)`;
                pupilRight.style.transform = `translate(${offsetX}px,${offsetY}px)`;
            }
            setTimeout(triggerLookAround, Math.random() * 4000 + 3000);
        }
        triggerLookAround();

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'vi-VN';
            recognition.continuous = false;

            recognition.onstart = () => {
                setRobotState('listening');
                statusText.innerText = "LẮNG NGHE";
                dialogueText.innerText = "Đang lắng nghe đạo hữu...";
            };

            recognition.onresult = (event) => {
                const userQuery = event.results[0][0].transcript;
                dialogueText.innerText = `Đạo hữu: "${userQuery}"`;
                handleUserSpeech(userQuery);
            };

            recognition.onerror = (e) => {
                console.error(e);
                setRobotState('idle');
                statusText.innerText = "TRỰC GÁC";
            };

            recognition.onend = () => {
                if (isListening && !body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                    setRobotState('idle');
                    statusText.innerText = "TRỰC GÁC";
                }
            };
        }

        function setRobotState(state) {
            body.className = '';
            body.classList.add(`state-${state}`);
            if (state === 'idle') {
                pupilLeft.style.transform = 'translate(0, 0)';
                pupilRight.style.transform = 'translate(0, 0)';
            }
        }

        function toggleVoiceSession() {
            if (!recognition) return;
            if (!isListening) {
                isListening = true;
                micBtn.classList.add('active');
                hintText.innerText = "Đang mở micro — Hãy nói tự nhiên";
                recognition.start();
            } else {
                isListening = false;
                micBtn.classList.remove('active');
                hintText.innerText = "Chạm để bắt đầu nói";
                recognition.stop();
                setRobotState('idle');
                statusText.innerText = "TRỰC GÁC";
            }
        }

        async function handleUserSpeech(query) {
            setRobotState('thinking');
            statusText.innerText = "SUY NGẪM";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query, model: currentModel })
                });

                if (!response.ok) {
                    throw new Error(`Mã phản hồi HTTP ${response.status}`);
                }

                const data = await response.json();
                const replyText = data.reply;
                dialogueText.innerText = `Tử Uyên: "${replyText}"`;
                speakResponse(replyText);

            } catch (err) {
                console.error("Lỗi:", err);
                dialogueText.innerText = `Lỗi kết nối: ${err.message || 'Không thể liên lạc máy chủ'}`;
                setRobotState('idle');
                statusText.innerText = "TRỰC GÁC";
            }
        }

        function speakResponse(text) {
            setRobotState('speaking');
            statusText.innerText = "CẤT TIẾNG";

            const cleanText = text.replace(/[*#`]/g, '');
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'vi-VN';
            utter.rate = 0.95;
            utter.pitch = 0.85;

            utter.onend = () => {
                setRobotState('idle');
                statusText.innerText = "TRỰC GÁC";
                if (isListening) {
                    setTimeout(() => { if (isListening) recognition.start(); }, 800);
                }
            };

            speechSynth.speak(utter);
        }
    </script>
</body>
</html>
