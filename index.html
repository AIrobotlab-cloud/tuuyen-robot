<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot Tử Uyên — Cyber Face V1.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background-color: #030712; color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .top-bar {
            width: 100%; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center;
            font-size: 13px; letter-spacing: 1px; color: #64748b; border-bottom: 1px solid rgba(255, 255, 255, 0.05); z-index: 10;
        }
        .status-badge { display: flex; align-items: center; gap: 8px; color: #38bdf8; font-weight: 600; }
        .dot { width: 8px; height: 8px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 10px #38bdf8; animation: pulse 2s infinite; }
        .face-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; width: 100%; }
        .eyes-wrapper { display: flex; gap: 60px; align-items: center; justify-content: center; position: relative; }
        .eye {
            width: 130px; height: 130px;
            background: radial-gradient(circle at 35% 35%, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
            border-radius: 40px; box-shadow: 0 0 45px rgba(56, 189, 248, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.6);
            position: relative; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow: hidden;
        }
        .eye::after {
            content: ''; position: absolute; top: 20%; left: 20%; width: 30px; height: 30px;
            background: rgba(255, 255, 255, 0.9); border-radius: 50%; filter: blur(2px);
        }
        .eye.blink { height: 6px !important; margin-top: 62px; border-radius: 10px; box-shadow: 0 0 20px #38bdf8; }
        .state-listening .eye { background: radial-gradient(circle, #22c55e 0%, #15803d 100%); box-shadow: 0 0 50px rgba(34, 197, 94, 0.7); transform: scale(1.08); }
        .state-thinking .eye { background: radial-gradient(circle, #f59e0b 0%, #b45309 100%); box-shadow: 0 0 50px rgba(245, 158, 11, 0.7); animation: thinkingAnim 1s infinite alternate; }
        @keyframes thinkingAnim { 0% { transform: translateY(-5px) scale(0.95); } 100% { transform: translateY(5px) scale(1.02); } }
        .state-speaking .eye { background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%); animation: speakingEye 0.4s infinite alternate; }
        @keyframes speakingEye { 0% { height: 110px; border-radius: 35px; } 100% { height: 140px; border-radius: 45px; } }
        .visualizer { display: flex; gap: 6px; height: 40px; align-items: center; margin-top: 40px; }
        .bar { width: 5px; height: 8px; background: #38bdf8; border-radius: 4px; transition: height 0.1s ease; }
        .state-speaking .bar { animation: wave 0.5s infinite ease-in-out alternate; }
        .bar:nth-child(1) { animation-delay: 0.1s; } .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.3s; } .bar:nth-child(4) { animation-delay: 0.4s; }
        .bar:nth-child(5) { animation-delay: 0.2s; }
        @keyframes wave { 0% { height: 8px; } 100% { height: 35px; background: #60a5fa; } }
        .dialogue-box {
            width: 90%; max-width: 600px; min-height: 70px; padding: 16px 20px;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
            text-align: center; font-size: 16px; line-height: 1.6; color: #e2e8f0; margin-bottom: 20px; transition: all 0.3s;
        }
        .controls { width: 100%; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 10; }
        .mic-btn {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: white;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 0 25px rgba(2, 132, 199, 0.4); transition: all 0.2s;
        }
        .mic-btn:active { transform: scale(0.92); }
        .mic-btn.active { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 35px rgba(239, 68, 68, 0.6); animation: pulse-red 1.5s infinite; }
        .hint-text { font-size: 13px; color: #94a3b8; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
</head>
<body class="state-idle">
    <div class="top-bar">
        <span>TỬ UYÊN // ROBOT AI V2.3</span>
        <div class="status-badge"><div class="dot"></div><span id="status-text">ĐANG TRỰC GÁC</span></div>
    </div>

    <div class="face-container">
        <div class="eyes-wrapper">
            <div class="eye left-eye" id="left-eye"></div>
            <div class="eye right-eye" id="right-eye"></div>
        </div>
        <div class="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>

    <div class="dialogue-box" id="dialogue-text">Chạm vào nút Micro để bắt đầu trò chuyện cùng Tử Uyên...</div>

    <div class="controls">
        <button class="mic-btn" id="mic-btn" onclick="toggleVoiceSession()">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
        </button>
        <span class="hint-text" id="hint-text">Chạm một lần để đàm thoại rảnh tay hai chiều</span>
    </div>

    <script>
        const body = document.body;
        const leftEye = document.getElementById('left-eye');
        const rightEye = document.getElementById('right-eye');
        const statusText = document.getElementById('status-text');
        const dialogueText = document.getElementById('dialogue-text');
        const micBtn = document.getElementById('mic-btn');
        const hintText = document.getElementById('hint-text');

        let isListening = false;
        let recognition = null;
        let speechSynth = window.speechSynthesis;

        function triggerBlink() {
            if (!body.classList.contains('state-speaking')) {
                leftEye.classList.add('blink'); rightEye.classList.add('blink');
                setTimeout(() => { leftEye.classList.remove('blink'); rightEye.classList.remove('blink'); }, 150);
            }
            setTimeout(triggerBlink, Math.random() * 3000 + 3000);
        }
        triggerBlink();

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'vi-VN';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                setRobotState('listening');
                statusText.innerText = "ĐANG LẮNG NGHE...";
                dialogueText.innerText = "Đang lắng nghe đạo hữu cất lời...";
            };

            recognition.onresult = (event) => {
                const userQuery = event.results[0][0].transcript;
                dialogueText.innerText = `Đạo hữu: "${userQuery}"`;
                handleUserSpeech(userQuery);
            };

            recognition.onerror = () => { setRobotState('idle'); statusText.innerText = "SẴN SÀNG"; };
            recognition.onend = () => {
                if (isListening && !body.classList.contains('state-thinking') && !body.classList.contains('state-speaking')) {
                    setRobotState('idle');
                }
            };
        }

        function setRobotState(state) {
            body.className = '';
            body.classList.add(`state-${state}`);
        }

        function toggleVoiceSession() {
            if (!recognition) return;
            if (!isListening) {
                isListening = true;
                micBtn.classList.add('active');
                hintText.innerText = "Đang mở micro — Hãy nói tự nhiên";
                recognition.start();
            } else {
                isListening = false;
                micBtn.classList.remove('active');
                hintText.innerText = "Chạm để bắt đầu nói";
                recognition.stop();
                setRobotState('idle');
                statusText.innerText = "ĐANG TRỰC GÁC";
            }
        }

        async function handleUserSpeech(query) {
            setRobotState('thinking');
            statusText.innerText = "ĐANG SUY NGẪM...";

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });

                const data = await response.json();
                const replyText = data.reply;
                dialogueText.innerText = `Tử Uyên: "${replyText}"`;
                speakResponse(replyText);
            } catch (err) {
                dialogueText.innerText = "Tử Uyên: Trục trặc kết nối bộ não...";
                setRobotState('idle');
            }
        }

        function speakResponse(text) {
            setRobotState('speaking');
            statusText.innerText = "ĐANG CẤT TIẾNG...";

            const cleanText = text.replace(/[*#`]/g, '');
            const utter = new SpeechSynthesisUtterance(cleanText);
            utter.lang = 'vi-VN';
            utter.rate = 0.95;
            utter.pitch = 0.85;

            utter.onend = () => {
                setRobotState('idle');
                statusText.innerText = "ĐANG TRỰC GÁC";
                if (isListening) {
                    setTimeout(() => { if (isListening) recognition.start(); }, 800);
                }
            };

            speechSynth.speak(utter);
        }
    </script>
</body>
</html>
